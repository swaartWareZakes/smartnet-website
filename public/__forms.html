<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SmartNet Forms</title>
  </head>
  <body>
    <form
      name="nexus-enquiry"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="nexus-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="enquiry_id" />
      <input type="text" name="status" />
      <input type="text" name="visitor_name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="preferred_contact" />
      <input type="text" name="company_name" />
      <input type="text" name="company_website" />
      <textarea name="summary"></textarea>
      <textarea name="research_links"></textarea>
      <input type="text" name="consent_timestamp" />
      <input type="text" name="transcript_saved" />
    </form>
  </body>
</html>
